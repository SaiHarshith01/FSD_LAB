<!DOCTYPE html>
<html>
<head>
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-box">

        <h1>Simple Quiz</h1>

        <div class="timer">
            Time Left: <span id="timer">15</span>s
        </div>

        <h2 id="question">Question</h2>

        <div id="options"></div>

        <button id="next-btn">Next</button>

        <p id="score"></p>

        <p id="result"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
